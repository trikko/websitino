name: Build websitino (macOS)

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14, macos-15-intel]
        dc: [ldc-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: dlang-community/setup-dlang@v1
      with:
        compiler: ${{ matrix.dc }}

    - name: Set version info for release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=$(echo ${{ github.ref }} | sed 's/refs\/tags\///')
        echo "enum WEBSITINO_VERSION = \"$VERSION\";" >> source/app.d

    # Link OpenSSL statically: the binary must not depend on Homebrew
    - name: Static OpenSSL
      run: |
        OSSL=$(brew --prefix openssl@3)
        # ld picks a dylib over an archive: move the dylibs away while linking (curl needs them later)
        mkdir -p "$RUNNER_TEMP/dylibs"
        mv "$OSSL"/lib/libssl*.dylib "$OSSL"/lib/libcrypto*.dylib "$RUNNER_TEMP/dylibs/"
        echo "OSSL=$OSSL" >> $GITHUB_ENV
        echo "C_INCLUDE_PATH=$OSSL/include" >> $GITHUB_ENV
        echo "LIBRARY_PATH=$OSSL/lib" >> $GITHUB_ENV

    - name: 'Build & Test'
      run: |
        dub build --compiler=$DC --build=release --config=macos-static
        mv "$RUNNER_TEMP"/dylibs/* "$OSSL/lib/"
        otool -L websitino
        if otool -L websitino | grep -qE 'libssl|libcrypto'; then echo "OpenSSL is linked dynamically"; exit 1; fi

    - name: Smoke test
      run: tests/smoke.sh ./websitino

    - name: Upload binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: websitino-${{ matrix.os }}
        path: websitino
