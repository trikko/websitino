# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Build websitino (macOS)

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A binary needs at least the macOS it was built for, which by default is the runner's one.
# One build per CPU, for macOS 12 and later, whatever runner is available.
env:
  MACOSX_DEPLOYMENT_TARGET: '12.0'
  OPENSSL_VERSION: '3.5.9'

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
    - uses: dlang-community/setup-dlang@v1
      with:
        compiler: ldc-latest

    - name: Set version info for release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=$(echo ${{ github.ref }} | sed 's/refs\/tags\///')
        echo "enum WEBSITINO_VERSION = \"$VERSION\";" >> source/app.d

    # Homebrew's OpenSSL is built for the runner's macOS: build our own, static only,
    # for MACOSX_DEPLOYMENT_TARGET. Nothing to hide while linking, there are no dylibs.
    - name: Cache OpenSSL
      id: openssl-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/openssl
        key: openssl-${{ env.OPENSSL_VERSION }}-${{ matrix.arch }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}

    - name: Build OpenSSL
      if: steps.openssl-cache.outputs.cache-hit != 'true'
      run: |
        curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz" | tar xz
        cd "openssl-$OPENSSL_VERSION"
        ./Configure darwin64-${{ matrix.arch }}-cc no-shared no-tests no-docs --prefix="$RUNNER_TEMP/openssl" --libdir=lib
        make -j"$(sysctl -n hw.ncpu)" build_libs
        make install_dev

    # dub asks pkg-config for the libraries, which would find Homebrew's: only ours is visible
    - name: Static OpenSSL
      run: |
        echo "PKG_CONFIG_LIBDIR=$RUNNER_TEMP/openssl/lib/pkgconfig" >> $GITHUB_ENV
        echo "C_INCLUDE_PATH=$RUNNER_TEMP/openssl/include" >> $GITHUB_ENV
        echo "LIBRARY_PATH=$RUNNER_TEMP/openssl/lib" >> $GITHUB_ENV

    - name: 'Build & Test'
      run: |
        dub build --compiler=$DC --build=release --config=macos-static 2>&1 | tee build.log
        otool -L websitino
        if otool -L websitino | grep -qE 'libssl|libcrypto'; then echo "OpenSSL is linked dynamically"; exit 1; fi
        # An object built for a newer macOS makes the binary fail there at run time, not at link time
        if grep -i 'built for newer' build.log; then echo "Some objects need a newer macOS"; exit 1; fi
        minos=$(otool -l websitino | awk '/LC_BUILD_VERSION/ { f = 1 } f && $1 == "minos" { print $2; exit }')
        echo "minos: $minos"
        if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ] && [ "$minos.0" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
          echo "Built for macOS $minos, expected $MACOSX_DEPLOYMENT_TARGET"; exit 1
        fi

    - name: Smoke test
      run: tests/smoke.sh ./websitino

    - name: Upload binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.arch }}
        path: websitino

  # The same binaries on other macOS versions. There is no free Intel runner with macOS 14:
  # there the Intel build runs under Rosetta, which is how it runs on an Apple Silicon Mac anyway.
  test:
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-26
            arch: arm64
          - os: macos-14
            arch: x86_64
          - os: macos-26-intel
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Download binary
      uses: actions/download-artifact@v4
      with:
        name: macos-${{ matrix.arch }}

    - name: Rosetta
      if: matrix.arch == 'x86_64' && runner.arch == 'ARM64'
      run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license

    - name: Smoke test
      run: |
        chmod +x websitino
        sw_vers
        file websitino
        tests/smoke.sh ./websitino
