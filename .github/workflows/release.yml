name: Release websitino

# The three builds used to publish to gh-pages each on their own, and racing pushes left all
# but the first one rejected. Here they only build; one job publishes everything at once.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
  macos:
    uses: ./.github/workflows/macos.yml
  windows:
    uses: ./.github/workflows/windows.yml

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
    - name: Download all binaries
      uses: actions/download-artifact@v8
      with:
        path: dist

    # Artifacts come back without the executable bit, which gh-pages has always served them with.
    - name: Lay out the gh-pages tree
      run: |
        mkdir -p public/linux public/linux-arm64 public/windows
        cp dist/linux/websitino dist/linux/websitino.deb public/linux/
        cp dist/linux-arm64/websitino dist/linux-arm64/websitino.deb public/linux-arm64/
        cp dist/websitino.exe/websitino.exe public/windows/
        for arch in arm64 x86_64; do
          mkdir -p "public/macos-$arch"
          cp "dist/macos-$arch/websitino" "public/macos-$arch/"
        done
        # The old folders, one per runner, for the links already around
        for d in macos-14 macos-15; do
          mkdir -p "public/$d"
          cp dist/macos-arm64/websitino "public/$d/"
        done
        mkdir -p public/macos-15-intel
        cp dist/macos-x86_64/websitino public/macos-15-intel/
        chmod +x public/*/websitino
        find public -type f -exec ls -l {} +

    - name: Deploy to GitHub Pages
      if: startsWith(github.ref, 'refs/tags/v')
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        force_orphan: false
        keep_files: true

  # Download page and install script after the binaries, so their new links never point to nothing
  site:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/pages.yml
